apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example of a remote Helm chart:
# helmCharts:
#   - name: nginx
#     repo: https://charts.bitnami.com/bitnami
#     version: 15.0.0
#     releaseName: remote-nginx

helmCharts:
  - name: kustomize-helm
    version: 0.1.0
    releaseName: kustomize-helm

helmGlobals:
  chartHome: charts


patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kustomize-helm
    data:
      specialValue: "Added by Kustomize"
      env: ""
      params: ""
