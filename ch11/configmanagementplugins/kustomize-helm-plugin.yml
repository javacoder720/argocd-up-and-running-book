apiVersion: v1
kind: ConfigMap
metadata:
  name: kustomize-helm-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kustomize-helm
    spec:
      parameters:
        static:
          - name: replica_count
            title: Replica Count
            tooltip: "Number of replicas to set in the generated manifests"
          - name: environment
            title: Deployment Environment
            tooltip: "Target environment (e.g., prod, stage, dev)"
      init:
        command: ["/bin/sh", "-c"]
        args:
          - |
            wget -O /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 && \
            chmod +x /tmp/yq
      generate:
        command: ["/bin/sh", "-c"]
        args: 
          - |
            # Gather all ARGOCD_ENV_ variables and strip prefix
            ENV_CONTENT=$(env | grep "^ARGOCD_ENV_" | sed "s/^ARGOCD_ENV_//" | awk -F= "{printf \"  %s: %s\n\", \$1, \$2}")
            # Gather all ARGOCD_APP_PARAMETER_ variables and strip prefix
            PARAM_CONTENT=$(env | grep "^ARGOCD_APP_PARAMETER_" | sed "s/^ARGOCD_APP_PARAMETER_//" | awk -F= "{printf \"  %s: %s\n\", \$1, \$2}")
            
            kustomize build --enable-helm | \
            /tmp/yq "
              .data.env = \"\n${ENV_CONTENT}\" |
              .data.params = \"\n${PARAM_CONTENT}\"
            "

