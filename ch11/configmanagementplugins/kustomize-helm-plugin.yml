apiVersion: v1
kind: ConfigMap
metadata:
  name: kustomize-helm-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kustomize-helm
    spec:
      parameters:
        static:
          - name: replica_count
            title: Replica Count
            tooltip: "Number of replicas to set in the generated manifests"
          - name: environment
            title: Deployment Environment
            tooltip: "Target environment (e.g., prod, stage, dev)"
      init:
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Download yq
            wget -O /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 && chmod +x /tmp/yq
            
            # Download kustomize
            wget -O /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.1.1/kustomize_v5.1.1_linux_amd64.tar.gz
            tar -xzf /tmp/kustomize.tar.gz -C /tmp && chmod +x /tmp/kustomize
            
            # Download helm
            wget -O /tmp/helm.tar.gz https://get.helm.sh/helm-v3.13.1-linux-amd64.tar.gz
            tar -xzf /tmp/helm.tar.gz -C /tmp --strip-components=1 linux-amd64/helm && chmod +x /tmp/helm
      generate:
        command: ["/bin/sh", "-c"]
        args: 
          - |
            export PATH=/tmp:$PATH
            # Gather all ARGOCD_ENV_ variables and strip prefix
            ENV_CONTENT=$(env | grep "^ARGOCD_ENV_" | sed 's/^ARGOCD_ENV_//' | awk -F= '{printf "  %s: %s\n", $1, $2}')
            # Gather all ARGOCD_APP_PARAMETER_ variables and strip prefix
            PARAM_CONTENT=$(env | grep "^ARGOCD_APP_PARAMETER_" | sed 's/^ARGOCD_APP_PARAMETER_//' | awk -F= '{printf "  %s: %s\n", $1, $2}')
            
            
            kustomize build --enable-helm > /tmp/base.yaml
            yq -n '.data.env = (strenv(ENV_CONTENT) | from_yaml) | .data.params = (strenv(PARAM_CONTENT) | from_yaml)' > /tmp/input.yaml
            yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' /tmp/base.yaml /tmp/input.yaml
