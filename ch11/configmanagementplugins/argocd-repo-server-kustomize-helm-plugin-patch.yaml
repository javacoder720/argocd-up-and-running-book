apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: kustomize-helm-plugin
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          image: quay.io/argoproj/argocd:v2.12.6
          imagePullPolicy: IfNotPresent
          command: [/var/run/argocd/argocd-cmp-server]
          volumeMounts:
            - mountPath: /var/run/argocd # from repo server
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins # from repo server
              name: plugins
            - mountPath: /home/argocd/cmp-server/config/plugin.yaml # we attached from the cm we created
              subPath: plugin.yaml
              name: kustomize-helm-plugin
            - mountPath: /tmp # we attached
              name: cmp-tmp
      volumes:
        - name: kustomize-helm-plugin
          configMap:
            name: kustomize-helm-plugin
        - emptyDir: {}
          name: cmp-tmp

