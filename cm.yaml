apiVersion: v1
data:
  plugin.yaml: "apiVersion: argoproj.io/v1alpha1\nkind: ConfigManagementPlugin\nmetadata:\n
    \ name: kustomize-helm\nspec:\n  parameters:\n    static:\n      - name: replica_count\n
    \       title: Replica Count\n        tooltip: \"Number of replicas to set in
    the generated manifests\"\n      - name: environment\n        title: Deployment
    Environment\n        tooltip: \"Target environment (e.g., prod, stage, dev)\"\n
    \ init:\n    command: [\"/bin/sh\", \"-c\"]\n    args:\n      - |\n        # Download
    yq\n        wget -O /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64
    && chmod +x /tmp/yq\n        \n        # Download kustomize\n        wget -O /tmp/kustomize.tar.gz
    https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.1.1/kustomize_v5.1.1_linux_amd64.tar.gz\n
    \       tar -xzf /tmp/kustomize.tar.gz -C /tmp && chmod +x /tmp/kustomize\n        \n
    \       # Download helm\n        wget -O /tmp/helm.tar.gz https://get.helm.sh/helm-v3.13.1-linux-amd64.tar.gz\n
    \       tar -xzf /tmp/helm.tar.gz -C /tmp --strip-components=1 linux-amd64/helm
    && chmod +x /tmp/helm\n  generate:\n    command: [\"/bin/sh\", \"-c\"]\n    args:
    \n      - |\n        export PATH=/tmp:$PATH\n        # Gather all ARGOCD_ENV_
    variables and strip prefix\n        ENV_CONTENT=$(env | grep \"^ARGOCD_ENV_\"
    | sed \"s/^ARGOCD_ENV_//\" | awk -F= \"{printf \\\"  %s: %s\\n\\\", \\$1, \\$2}\")\n
    \       # Gather all ARGOCD_APP_PARAMETER_ variables and strip prefix\n        PARAM_CONTENT=$(env
    | grep \"^ARGOCD_APP_PARAMETER_\" | sed \"s/^ARGOCD_APP_PARAMETER_//\" | awk -F=
    \"{printf \\\"  %s: %s\\n\\\", \\$1, \\$2}\")\n        \n        kustomize build
    --enable-helm | \\\n        yq \"\n          .data.env = \\\"\\n${ENV_CONTENT}\\\"
    |\n          .data.params = \\\"\\n${PARAM_CONTENT}\\\"\n        \"\n"
kind: ConfigMap
metadata:
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: |
      {"apiVersion":"v1","data":{"plugin.yaml":"apiVersion: argoproj.io/v1alpha1\nkind: ConfigManagementPlugin\nmetadata:\n  name: kustomize-helm\nspec:\n  parameters:\n    static:\n      - name: replica_count\n        title: Replica Count\n        tooltip: \"Number of replicas to set in the generated manifests\"\n      - name: environment\n        title: Deployment Environment\n        tooltip: \"Target environment (e.g., prod, stage, dev)\"\n  init:\n    command: [\"/bin/sh\", \"-c\"]\n    args:\n      - |\n        # Download yq\n        wget -O /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 \u0026\u0026 chmod +x /tmp/yq\n        \n        # Download kustomize\n        wget -O /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.1.1/kustomize_v5.1.1_linux_amd64.tar.gz\n        tar -xzf /tmp/kustomize.tar.gz -C /tmp \u0026\u0026 chmod +x /tmp/kustomize\n        \n        # Download helm\n        wget -O /tmp/helm.tar.gz https://get.helm.sh/helm-v3.13.1-linux-amd64.tar.gz\n        tar -xzf /tmp/helm.tar.gz -C /tmp --strip-components=1 linux-amd64/helm \u0026\u0026 chmod +x /tmp/helm\n  generate:\n    command: [\"/bin/sh\", \"-c\"]\n    args: \n      - |\n        export PATH=/tmp:$PATH\n        # Gather all ARGOCD_ENV_ variables and strip prefix\n        ENV_CONTENT=$(env | grep \"^ARGOCD_ENV_\" | sed \"s/^ARGOCD_ENV_//\" | awk -F= \"{printf \\\"  %s: %s\\n\\\", \\$1, \\$2}\")\n        # Gather all ARGOCD_APP_PARAMETER_ variables and strip prefix\n        PARAM_CONTENT=$(env | grep \"^ARGOCD_APP_PARAMETER_\" | sed \"s/^ARGOCD_APP_PARAMETER_//\" | awk -F= \"{printf \\\"  %s: %s\\n\\\", \\$1, \\$2}\")\n        \n        kustomize build --enable-helm | \\\n        yq \"\n          .data.env = \\\"\\n${ENV_CONTENT}\\\" |\n          .data.params = \\\"\\n${PARAM_CONTENT}\\\"\n        \"\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"kustomize-helm-plugin","namespace":"argocd"}}
